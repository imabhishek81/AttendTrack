<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Inner Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  <!-- Graduation Cap Icon -->
  <g filter="url(#glow)">
    <!-- Cap Diamond -->
    <path d="M256 128 L432 208 L256 288 L80 208 Z" fill="#ffffff" />
    <!-- Cap Base / Arch -->
    <path d="M144 246 L144 320 C144 360 194 384 256 384 C318 384 368 360 368 320 L368 246 L256 298 Z" fill="rgba(255,255,255,0.9)" />
    <!-- Tassel -->
    <path d="M400 220 L400 336 C400 348 388 356 380 356 C372 356 364 348 364 336 L364 236" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
    <circle cx="372" cy="360" r="14" fill="#fbbf24" />
  </g>
</svg>
