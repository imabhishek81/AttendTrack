services:
  # ─── 1. Spring Boot 3 Backend ──────────────
  - type: web
    name: attendtrack-backend
    runtime: docker
    dockerfilePath: ./attendance-backend/Dockerfile
    dockerContext: ./attendance-backend
    plan: free
    healthCheckPath: /api/dashboard
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: attendtrack-db
          property: connectionString
      - key: APP_JWT_SECRET
        generateValue: true

  # ─── 2. React PWA Frontend ─────────────────
  - type: web
    name: attendtrack-frontend
    runtime: static
    buildCommand: cd attendance-frontend && npm ci && npm run build
    staticPublishPath: ./attendance-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: attendtrack-backend
          property: host

# ─── 3. Cloud Database ─────────────────────
databases:
  - name: attendtrack-db
    plan: free
    databaseName: attendance_db
    user: root
