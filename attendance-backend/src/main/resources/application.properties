# ==========================================
# Spring Boot Application Configuration
# ==========================================

# Server Port
server.port=8080

# Application Name
spring.application.name=attendance-backend

# ─── MySQL Database Connection ─────────────
# 🎓 Spring Boot Note:
# JDBC URL format: jdbc:mysql://<host>:<port>/<database_name>?options
# createDatabaseIfNotExist=true will auto-create the DB if missing!
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── Hibernate / JPA Configuration ────────
# 'update': Auto-creates or updates tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Enable initial data initialization ───
spring.jpa.defer-datasource-initialization=true

# ─── JWT Authentication Configuration ────
# 🎓 Spring Boot Note: 256-bit secret key used to sign HMAC-SHA256 tokens
app.jwt.secret=attendtracksecretkeyforjwttokengenerationshouldbelongenough256bitsecurekey
app.jwt.expiration-ms=86400000

# ─── Logging ──────────────────────────────
logging.level.com.attendtrack=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
