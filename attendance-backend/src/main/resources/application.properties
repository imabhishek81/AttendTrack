# ==========================================
# Spring Boot Application Configuration
# ==========================================

# Server Port (auto-binds to Render/Railway $PORT or 8080 locally)
server.port=${PORT:8080}

# Application Name
spring.application.name=attendance-backend

# ─── Database Connection (Supports MySQL, PostgreSQL on Render, & H2) ───
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# ─── Hibernate / JPA Configuration ────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# ─── JWT Authentication Configuration ────
app.jwt.secret=${APP_JWT_SECRET:attendtracksecretkeyforjwttokengenerationshouldbelongenough256bitsecurekey}
app.jwt.expiration-ms=86400000

# ─── Logging ──────────────────────────────
logging.level.com.attendtrack=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
